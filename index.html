<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pi_Kid71's search" />
    <title>Pi_Kid71's search</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="search-shell">
      <section class="search-card" aria-labelledby="search-title">
        <div class="brand" aria-hidden="true"><span>PK</span></div>
        <h1 id="search-title">Pi_Kid71's search</h1>

        <form id="search-form" role="search">
          <label class="sr-only" for="query">Search query</label>
          <div class="search-row">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10.5 18a7.5 7.5 0 1 1 5.3-2.2l5.2 5.2-1.6 1.6-5.2-5.2A7.46 7.46 0 0 1 10.5 18Zm0-13.5a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z" />
            </svg>
            <input
              id="query"
              name="q"
              type="search"
              placeholder="What are you looking for?"
              autocomplete="off"
              enterkeyhint="search"
              autofocus
            />
          </div>

          <div class="engine-field">
            <label for="engine">Search engine</label>
            <select id="engine" name="engine">
              <optgroup label="Popular">
                <option value="google">Google</option>
                <option value="duckduckgo">DuckDuckGo</option>
                <option value="bing">Bing</option>
                <option value="brave">Brave</option>
              </optgroup>
            </select>
          </div>

          <details class="custom-engines">
            <summary>Manage search engines</summary>
            <div class="custom-form">
              <label for="custom-name">Name</label>
              <input id="custom-name" type="text" placeholder="My search" maxlength="40" />
              <label for="custom-url">Search URL</label>
              <input
                id="custom-url"
                type="url"
                placeholder="https://example.com/search?q={query}"
                inputmode="url"
                autocapitalize="off"
                autocomplete="off"
              />
              <p class="custom-help">
                Use <code>{query}</code> or <code>%s</code> as the query placeholder.
              </p>
              <button id="add-custom" type="button" class="secondary-button">
                Add engine
              </button>
            </div>
            <div id="custom-list" class="custom-list" aria-live="polite"></div>
            <div id="engine-list" class="engine-list" aria-live="polite"></div>
          </details>

          <details class="history-panel" id="history-panel">
            <summary>Search history</summary>
            <div class="history-toolbar">
              <button id="edit-history" type="button" class="text-button">Edit</button>
              <button id="clear-history" type="button" class="text-button danger-text">Clear all</button>
            </div>
            <div id="history-list" class="history-list" aria-live="polite"></div>
          </details>

          <button type="submit">Search</button>
        </form>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
